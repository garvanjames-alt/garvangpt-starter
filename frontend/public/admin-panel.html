<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GarvanGPT Admin Panel</title>
  <style>
    :root{
      --bg:#06080c; --panel:#0f141c; --panel2:#0b1017; --text:#e6ebf2; --muted:#9aa4b2;
      --accent:#0ea5e9; --accent2:#22c55e; --danger:#ef4444;
      --radius:16px;
      font-synthesis: style;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(1200px 600px at 10% -10%, #10203a 0%, transparent 60%), var(--bg); color:var(--text);}    
    header{padding:20px 24px; border-bottom:1px solid #172033; position:sticky; top:0; background:rgba(6,8,12,.9); backdrop-filter: blur(6px); z-index:2;}
    h1{margin:0; font-size:22px; letter-spacing:.2px;}
    .sub{color:var(--muted); margin-top:6px; font-size:13px;}
    main{padding:22px; display:grid; gap:18px; max-width:1100px; margin:0 auto;}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)), var(--panel); border:1px solid #1a2336; border-radius:var(--radius); padding:16px; box-shadow: 0 12px 40px rgba(0,0,0,.45);}  
    .row{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:12px; align-items:end;}
    label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
    input, textarea{width:100%; background:var(--panel2); border:1px solid #1c2940; color:var(--text); padding:10px 12px; border-radius:12px; outline:none; font-size:14px;}
    input:focus, textarea:focus{border-color:#2a81ff; box-shadow:0 0 0 3px rgba(42,129,255,.15);}  
    button{background:#1a2336; color:var(--text); border:1px solid #243352; padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:600; font-size:14px; transition:.12s ease;} 
    button:hover{transform:translateY(-1px); border-color:#375a93;} 
    .primary{background:var(--accent); border-color:transparent; color:#03101a;} 
    .primary:hover{filter:brightness(1.05);} 
    .ghost{background:transparent;} 
    .danger{background:rgba(239,68,68,.12); border-color:#3a1a1a; color:#ffd6d6;} 
    .danger:hover{border-color:#ef4444;} 
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;} 
    .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;} 
    .btnrow{display:flex; gap:8px; flex-wrap:wrap;} 
    .hint{color:var(--muted); font-size:12px; margin-top:6px;} 
    pre{white-space:pre-wrap; word-break:break-word; font-size:12.5px; background: #05070a; border:1px solid #151c2b; border-radius:12px; padding:12px; max-height:280px; overflow:auto;} 
    .ok{color:#7ee787;} .bad{color:#ff7b72;}
  </style>
</head>
<body>
<header>
  <h1>GarvanGPT Admin Panel</h1>
  <div class="sub">Step 87: Wire frontend → backend with cookies (Render → Render)</div>
</header>

<main>
  <section class="card">
    <div class="row">
      <div>
        <label>Backend Base URL</label>
        <input id="baseUrl" placeholder="https://almosthuman-starter-staging.onrender.com" value="https://almosthuman-starter-staging.onrender.com" />
        <div class="hint">Calls use credentials:'include' and full HTTPS URLs.</div>
      </div>
      <div>
        <label>Username</label>
        <input id="username" placeholder="garvan" value="garvan" />
      </div>
      <div>
        <label>Password</label>
        <input id="password" type="password" placeholder="your-admin-password" />
      </div>
      <div class="btnrow">
        <button id="btnHealth">Health</button>
        <button id="btnLogin" class="primary">Login (set cookie)</button>
        <button id="btnPing">Admin Ping</button>
      </div>
    </div>
  </section>

  <section class="card grid2">
    <div>
      <label>Memory (GET)</label>
      <button id="btnGetMem" style="width:100%">Fetch Memory</button>
    </div>
    <div>
      <label>Add Memory (POST)</label>
      <div style="display:flex; gap:8px;">
        <input id="memText" placeholder="text to store..." />
        <button id="btnAddMem" class="primary">Add</button>
      </div>
      <div style="margin-top:8px;">
        <button id="btnClearMem" class="danger" style="width:100%">Delete All</button>
      </div>
    </div>
  </section>

  <section class="card">
    <label>Respond (proxy LLM)</label>
    <div style="display:flex; gap:8px;">
      <input id="question" placeholder="Say hello from staging and tell me the environment name." value="Say hello from staging and tell me the environment name." />
      <button id="btnAsk" class="primary">Send</button>
    </div>
  </section>

  <section class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label style="margin:0;">Output</label>
      <div class="btnrow">
        <button id="btnClearOut" class="ghost">Clear Output</button>
        <button id="btnCopy">Copy</button>
      </div>
    </div>
    <pre id="out">Ready.</pre>
    <div class="hint">If you see <span class="ok">200 OK</span> for Admin Ping and can read/add memory, cookies and CORS are correct.</div>
  </section>
</main>

<script>
  const $ = (id)=>document.getElementById(id);
  const out = $("out");

  function normBase(){
    const raw = $("baseUrl").value.trim();
    return raw.replace(/\/+$/,''); // strip trailing slash
  }
  function log(label, payload){
    const ts = new Date().toISOString();
    out.textContent = `${out.textContent}\n\n[${ts}] ${label}: ${JSON.stringify(payload, null, 2)}`;
    out.scrollTop = out.scrollHeight;
  }

  async function callJson(url, opts={}){
    const res = await fetch(url, {
      ...opts,
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) }
    });
    let body;
    const ct = res.headers.get('content-type') || '';
    if(ct.includes('application/json')){
      body = await res.json().catch(()=>null);
    } else {
      body = await res.text().catch(()=>null);
    }
    return { ok: res.ok, status: res.status, url, body, headers: Object.fromEntries(res.headers.entries()) };
  }

  $("btnHealth").onclick = async ()=>{
    const url = `${normBase()}/health`;
    const r = await callJson(url, { method:'GET', headers:{} });
    log('HEALTH', r);
  };

  $("btnLogin").onclick = async ()=>{
    const base = normBase();
    const u = $("username").value.trim();
    const p = $("password").value; // DO NOT trim password

    if(!u || !p){
      log('LOGIN', { ok:false, status:400, error:'username and password required (client-side)', sent:{username:u, password: p? '***' : ''}, url:`${base}/login` });
      return;
    }

    // ✅ Auth endpoints are root-level now
    const url = `${base}/login`;
    const r = await callJson(url, { method:'POST', body: JSON.stringify({ username:u, password:p }) });
    // Add what we actually sent (masking password)
    r.sent = { username: u, password: '***', url };
    log('LOGIN', r);
  };

  $("btnPing").onclick = async ()=>{
    // ✅ Match backend auth route
    const url = `${normBase()}/admin/ping`;
    const r = await callJson(url, { method:'GET', headers:{} });
    log('ADMIN_PING', r);
  };

  $("btnGetMem").onclick = async ()=>{
    const url = `${normBase()}/api/memory`;
    const r = await callJson(url, { method:'GET', headers:{} });
    log('MEMORY_GET', r);
  };

  $("btnAddMem").onclick = async ()=>{
    const text = $("memText").value.trim();
    const url = `${normBase()}/api/memory`;
    const r = await callJson(url, { method:'POST', body: JSON.stringify({ text }) });
    log('MEMORY_POST', r);
  };

  $("btnClearMem").onclick = async ()=>{
    const url = `${normBase()}/api/memory`;
    const r = await callJson(url, { method:'DELETE', headers:{} });
    log('MEMORY_DELETE', r);
  };

  $("btnAsk").onclick = async ()=>{
    const question = $("question").value.trim();
    const url = `${normBase()}/api/respond`;
    const r = await callJson(url, { method:'POST', body: JSON.stringify({ question }) });
    log('RESPOND', r);
  };

  $("btnClearOut").onclick = ()=> out.textContent = 'Ready.';
  $("btnCopy").onclick = async ()=>{
    await navigator.clipboard.writeText(out.textContent);
  };
</script>
</body>
</html>
